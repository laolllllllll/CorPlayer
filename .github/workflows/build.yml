name: Build CorPlayer IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate

      - name: Build
        run: |
          cd ios
          xcodebuild -project CorPlayer.xcodeproj \
            -scheme CorPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CorPlayer.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          cd ios
          mkdir -p build/Payload
          cp -R build/CorPlayer.xcarchive/Products/Applications/CorPlayer.app build/Payload/
          cd build && zip -r ../CorPlayer.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CorPlayer.ipa
          path: ios/CorPlayer.ipa

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: CorPlayer.app
          path: ios/build/CorPlayer.xcarchive/Products/Applications/CorPlayer.app
