<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorPlayer - 音乐播放器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
.hero { text-align: center; padding: 80px 20px 40px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
.hero h1 { font-size: 48px; background: linear-gradient(90deg, #e94560, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
.hero p { font-size: 18px; color: #aaa; margin-bottom: 32px; }
.hero .btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 12px 32px; border-radius: 25px; border: none; font-size: 16px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn-primary { background: linear-gradient(90deg, #e94560, #ff6b6b); color: #fff; }
.btn-outline { background: transparent; border: 1px solid #e94560; color: #e94560; }
.container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
.section { margin-bottom: 48px; }
.section h2 { font-size: 24px; margin-bottom: 20px; color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
.card { background: #1a1a2e; border-radius: 12px; padding: 16px; cursor: pointer; transition: transform .2s; }
.card:hover { transform: translateY(-4px); }
.card .cover { width: 100%; aspect-ratio: 1; background: linear-gradient(135deg, #e94560, #533483); border-radius: 8px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
.card .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.card .artist { font-size: 13px; color: #888; }
.footer { text-align: center; padding: 40px; color: #555; font-size: 14px; border-top: 1px solid #222; }
</style>
</head>
<body>
<div class="hero">
  <h1>🎵 CorPlayer</h1>
  <p>简洁优雅的音乐播放器 · 支持 .core 格式 · 本地播放</p>
  <div class="btns">
    <a href="/app/index.html" class="btn btn-primary">进入音乐库</a>
    <a href="/admin" class="btn btn-outline">后台管理</a>
  </div>
</div>
<div class="container">
  <div class="section">
    <h2>🔥 热门歌曲</h2>
    <div class="grid" id="hotSongs"></div>
  </div>
  <div class="section">
    <h2>🎤 热门歌手</h2>
    <div class="grid" id="hotSingers"></div>
  </div>
</div>
<div class="footer">CorPlayer © 2026 · 音乐让生活更美好</div>
<script>
fetch('/api/hot').then(r=>r.json()).then(songs=>{
  const el = document.getElementById('hotSongs');
  el.innerHTML = songs.slice(0,8).map(s=>`
    <div class="card" onclick="playSong('${s.id}')">
      <div class="cover">🎵</div>
      <div class="name">${s.name}</div>
      <div class="artist">${s.singer}</div>
    </div>`).join('');
});
fetch('/api/singers').then(r=>r.json()).then(singers=>{
  const el = document.getElementById('hotSingers');
  el.innerHTML = singers.slice(0,6).map(s=>`
    <div class="card" onclick="location.href='/geshou.html?${s.name}'">
      <div class="cover">🎤</div>
      <div class="name">${s.name}</div>
      <div class="artist">${s.intro||'歌手'}</div>
    </div>`).join('');
});
function playSong(id){ window.location.href='/app/index.html?play='+id; }
</script>
</body>
</html>
