<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorPlayer 后台管理</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,sans-serif; background:#0a0a0f; color:#fff; }
.header { background:#1a1a2e; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:20px; }
.tabs { display:flex; gap:0; background:#1a1a2e; border-bottom:1px solid #2a2a3e; }
.tab { padding:12px 24px; cursor:pointer; color:#888; border-bottom:2px solid transparent; }
.tab.active { color:#e94560; border-bottom-color:#e94560; }
.container { padding:20px; max-width:900px; margin:0 auto; }
.panel { display:none; }
.panel.active { display:block; }
.card { background:#1a1a2e; border-radius:10px; padding:16px; margin-bottom:16px; }
.card h3 { margin-bottom:12px; font-size:16px; }
input, textarea, select { width:100%; padding:10px 12px; background:#0a0a0f; border:1px solid #2a2a3e; border-radius:8px; color:#fff; font-size:14px; margin-bottom:10px; }
textarea { min-height:60px; resize:vertical; }
.btn { padding:10px 20px; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
.btn-primary { background:#e94560; color:#fff; }
.btn-danger { background:#dc3545; color:#fff; }
.btn-sm { padding:5px 12px; font-size:12px; }
.row { display:flex; gap:10px; }
.row > * { flex:1; }
.list-item { display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #2a2a3e; }
.list-item .info { flex:1; }
.list-item .title { font-size:14px; }
.list-item .sub { font-size:12px; color:#888; }
.list-item .actions { display:flex; gap:8px; }
.empty { text-align:center; padding:40px; color:#555; }
.msg { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:10px 24px; border-radius:8px; z-index:999; display:none; }
.msg.success { background:#28a745; }
.msg.error { background:#dc3545; }
</style>
</head>
<body>
<div class="header"><h1>⚙️ CorPlayer 后台管理</h1><a href="/" style="color:#888;text-decoration:none">返回首页</a></div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('singers')">歌手管理</div>
  <div class="tab" onclick="switchTab('songs')">歌曲管理</div>
  <div class="tab" onclick="switchTab('playlists')">歌单管理</div>
</div>
<div class="container">
  <!-- 歌手管理 -->
  <div class="panel active" id="panel-singers">
    <div class="card">
      <h3>添加歌手</h3>
      <input id="singerName" placeholder="歌手名">
      <input id="singerAvatar" placeholder="头像URL（可选）">
      <textarea id="singerIntro" placeholder="歌手简介"></textarea>
      <button class="btn btn-primary" onclick="addSinger()">添加歌手</button>
    </div>
    <div class="card">
      <h3>歌手列表</h3>
      <div id="singerList"></div>
    </div>
  </div>
  <!-- 歌曲管理 -->
  <div class="panel" id="panel-songs">
    <div class="card">
      <h3>添加歌曲</h3>
      <div class="row">
        <input id="songName" placeholder="歌曲名">
        <select id="songSinger"><option value="">选择歌手</option></select>
      </div>
      <input id="songAlbum" placeholder="专辑名">
      <input id="songCover" placeholder="封面URL">
      <input id="songMp3" placeholder="MP3 URL">
      <input id="songLrc" placeholder="歌词URL">
      <button class="btn btn-primary" onclick="addSong()">添加歌曲</button>
    </div>
    <div class="card">
      <h3>歌曲列表</h3>
      <div id="songList"></div>
    </div>
  </div>
  <!-- 歌单管理 -->
  <div class="panel" id="panel-playlists">
    <div class="card">
      <h3>添加歌单</h3>
      <input id="plName" placeholder="歌单名">
      <input id="plCover" placeholder="封面URL">
      <textarea id="plIntro" placeholder="歌单简介"></textarea>
      <button class="btn btn-primary" onclick="addPlaylist()">添加歌单</button>
    </div>
    <div class="card">
      <h3>歌单列表</h3>
      <div id="playlistList"></div>
    </div>
  </div>
</div>
<div class="msg" id="msg"></div>

<script>
function showMsg(text, type='success'){
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg '+type; m.style.display='block';
  setTimeout(()=>m.style.display='none', 2000);
}
function switchTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('panel-'+t).classList.add('active');
}

// ===== 歌手 =====
function loadSingers(){
  fetch('/api/singers').then(r=>r.json()).then(data=>{
    const el = document.getElementById('singerList');
    const sel = document.getElementById('songSinger');
    sel.innerHTML = '<option value="">选择歌手</option>' + data.map(s=>`<option value="${s.name}">${s.name}</option>`).join('');
    if(data.length===0){ el.innerHTML='<div class="empty">暂无歌手</div>'; return; }
    el.innerHTML = data.map(s=>`
      <div class="list-item">
        <div class="info"><div class="title">${s.name}</div><div class="sub">${s.intro||'无简介'}</div></div>
        <div class="actions">
          <button class="btn btn-sm btn-primary" onclick="editSinger('${s.id}','${s.name}')">改简介</button>
          <button class="btn btn-sm btn-danger" onclick="delSinger('${s.id}')">删除</button>
        </div>
      </div>`).join('');
  });
}
function addSinger(){
  const name = document.getElementById('singerName').value.trim();
  if(!name){ showMsg('请输入歌手名','error'); return; }
  fetch('/api/singer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name, avatar:document.getElementById('singerAvatar').value, intro:document.getElementById('singerIntro').value})})
    .then(r=>r.json()).then(d=>{
      if(d.error){ showMsg(d.error,'error'); }
      else { showMsg('添加成功'); document.getElementById('singerName').value=''; document.getElementById('singerIntro').value=''; loadSingers(); }
    });
}
function editSinger(id,name){
  const intro = prompt('修改歌手简介：', '');
  if(intro===null) return;
  fetch('/api/singer/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({intro})})
    .then(()=>{ showMsg('修改成功'); loadSingers(); });
}
function delSinger(id){
  if(!confirm('确定删除该歌手？')) return;
  fetch('/api/singer/'+id,{method:'DELETE'}).then(()=>{ showMsg('删除成功'); loadSingers(); });
}

// ===== 歌曲 =====
function loadSongs(){
  fetch('/api/songs').then(r=>r.json()).then(data=>{
    const el = document.getElementById('songList');
    if(data.length===0){ el.innerHTML='<div class="empty">暂无歌曲</div>'; return; }
    el.innerHTML = data.map(s=>`
      <div class="list-item">
        <div class="info"><div class="title">${s.name}</div><div class="sub">${s.singer} · ${s.album||'未知专辑'}</div></div>
        <div class="actions"><button class="btn btn-sm btn-danger" onclick="delSong('${s.id}')">删除</button></div>
      </div>`).join('');
  });
}
function addSong(){
  const name = document.getElementById('songName').value.trim();
  const singer = document.getElementById('songSinger').value;
  if(!name||!singer){ showMsg('请填写歌名和歌手','error'); return; }
  fetch('/api/song',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,singer,album:document.getElementById('songAlbum').value,
      cover:document.getElementById('songCover').value,mp3_url:document.getElementById('songMp3').value,lrc_url:document.getElementById('songLrc').value})})
    .then(r=>r.json()).then(d=>{
      if(d.error){ showMsg(d.error,'error'); }
      else { showMsg('添加成功'); ['songName','songAlbum','songCover','songMp3','songLrc'].forEach(id=>document.getElementById(id).value=''); loadSongs(); }
    });
}
function delSong(id){
  if(!confirm('确定删除该歌曲？')) return;
  fetch('/api/song/'+id,{method:'DELETE'}).then(()=>{ showMsg('删除成功'); loadSongs(); });
}

// ===== 歌单 =====
function loadPlaylists(){
  fetch('/api/playlists').then(r=>r.json()).then(data=>{
    const el = document.getElementById('playlistList');
    if(data.length===0){ el.innerHTML='<div class="empty">暂无歌单</div>'; return; }
    el.innerHTML = data.map(p=>`
      <div class="list-item">
        <div class="info"><div class="title">${p.name}</div><div class="sub">${p.intro||'无简介'} · ${p.songs?.length||0}首</div></div>
        <div class="actions"><button class="btn btn-sm btn-danger" onclick="delPlaylist('${p.id}')">删除</button></div>
      </div>`).join('');
  });
}
function addPlaylist(){
  const name = document.getElementById('plName').value.trim();
  if(!name){ showMsg('请输入歌单名','error'); return; }
  fetch('/api/playlist',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name,cover:document.getElementById('plCover').value,intro:document.getElementById('plIntro').value,songs:[]})})
    .then(r=>r.json()).then(d=>{
      if(d.error){ showMsg(d.error,'error'); }
      else { showMsg('添加成功'); document.getElementById('plName').value=''; document.getElementById('plIntro').value=''; loadPlaylists(); }
    });
}
function delPlaylist(id){
  if(!confirm('确定删除该歌单？')) return;
  fetch('/api/playlist/'+id,{method:'DELETE'}).then(()=>{ showMsg('删除成功'); loadPlaylists(); });
}

loadSingers(); loadSongs(); loadPlaylists();
</script>
</body>
</html>
