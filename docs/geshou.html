<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌手 - CorPlayer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh}
.header{background:linear-gradient(180deg,#1a1a2e,#0a0a0f);padding:40px 20px 30px;text-align:center}
.avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#e94560,#533483);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:40px}
.name{font-size:24px;font-weight:bold;margin-bottom:8px}
.intro{font-size:14px;color:#aaa}
.songs{padding:16px}
.songs h3{font-size:17px;margin-bottom:14px}
.song-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #1a1a2e;cursor:pointer}
.song-item .idx{width:30px;text-align:center;color:#666}
.song-item .info{flex:1}
.song-item .title{font-size:15px;margin-bottom:3px}
.song-item .album{font-size:12px;color:#888}
.song-item .play{color:#e94560;font-size:20px;padding:0 10px}
.back{position:absolute;top:16px;left:16px;font-size:24px;cursor:pointer;color:#fff;text-decoration:none}
.play-all-btn{display:inline-block;padding:8px 20px;background:linear-gradient(90deg,#e94560,#ff6b6b);border-radius:20px;border:none;color:#fff;font-size:14px;cursor:pointer;margin-left:12px}
.songs-header{display:flex;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<a href="javascript:history.back()" class="back">←</a>
<div class="header">
  <div class="avatar" id="avatar">🎤</div>
  <div class="name" id="singerName">加载中...</div>
  <div class="intro" id="singerIntro"></div>
</div>
<div class="songs">
  <div class="songs-header"><h3>全部歌曲</h3><button class="play-all-btn" onclick="playAll()">▶ 全部播放</button></div>
  <div id="songList"></div>
</div>
<script>
const BASE = location.origin + location.pathname.replace(/\/[^/]*$/,'/');
const name = decodeURIComponent(window.location.search.substring(1)||'');
let currentSongs = [];
document.getElementById('singerName').textContent = name;
Promise.all([fetch(BASE+'data/singers.json').then(r=>r.json()),fetch(BASE+'data/songs.json').then(r=>r.json())]).then(([singers,songs])=>{
  const singer = singers.find(s=>s.name===name);
  if(singer) document.getElementById('singerIntro').textContent = singer.intro||'';
  currentSongs = songs.filter(s=>s.singer===name);
  document.getElementById('songList').innerHTML = currentSongs.map((s,i)=>`
    <div class="song-item" onclick="play('${s.coreUrl}')">
      <span class="idx">${i+1}</span>
      <div class="info"><div class="title">${s.name}</div><div class="album">${s.album||''}</div></div>
      <span class="play">▶</span>
    </div>`).join('');
}).catch(()=>{document.getElementById('singerName').textContent='加载失败'});

function buildFullUrl(coreUrl){
  let url = coreUrl;
  if(!url.startsWith('http')) url = BASE + url;
  if(!url.endsWith('/')) url += '/';
  return url;
}

function play(coreUrl){
  window.location.href = 'cormusic://' + buildFullUrl(coreUrl);
}

function playAll(){
  if(currentSongs.length === 0){ alert('暂无歌曲'); return; }
  // 生成队列详情
  const queueData = {
    name: name + ' - 全部歌曲',
    type: 'queue',
    count: currentSongs.length,
    songs: currentSongs.map(s => ({
      name: s.name,
      singer: s.singer,
      album: s.album || '',
      coreUrl: buildFullUrl(s.coreUrl)
    }))
  };
  const jsonStr = JSON.stringify(queueData, null, 2);
  // 静态本地生成 duilie.json 并下载
  const blob = new Blob([jsonStr], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'duilie.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  // 通过 cormusic://queue 协议传递队列给APP
  const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
  setTimeout(() => {
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.corPlayer){
      window.webkit.messageHandlers.corPlayer.postMessage({type:'queue', data: base64});
    } else {
      window.location.href = 'cormusic://queue?data=' + encodeURIComponent(base64);
    }
  }, 300);
}
</script>
</body>
</html>
