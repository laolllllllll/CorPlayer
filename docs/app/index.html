<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CorPlayer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#fff;padding-bottom:20px}
.search-bar{position:sticky;top:0;background:#0a0a0f;padding:12px 16px;z-index:100;border-bottom:1px solid #1a1a2e}
.search-box{display:flex;background:#1a1a2e;border-radius:20px;padding:8px 14px;align-items:center}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;margin-left:8px}
.search-box .icon{color:#888;font-size:16px}
.search-types{display:flex;gap:8px;margin-top:10px}
.search-type{padding:5px 14px;border-radius:14px;font-size:13px;background:#1a1a2e;color:#888;cursor:pointer;border:none}
.search-type.active{background:#e94560;color:#fff}
.section{padding:16px}
.section h3{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.history{display:flex;flex-wrap:wrap;gap:8px}
.history-tag{padding:6px 14px;background:#1a1a2e;border-radius:14px;font-size:13px;color:#aaa;cursor:pointer}
.history-clear{color:#e94560;font-size:13px;cursor:pointer;margin-left:auto}
.song-list{display:flex;flex-direction:column}
.song-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #1a1a2e;cursor:pointer}
.song-item .idx{width:30px;text-align:center;color:#666;font-size:14px}
.song-item .info{flex:1}
.song-item .title{font-size:15px;margin-bottom:3px}
.song-item .artist{font-size:12px;color:#888}
.song-item .play-btn{color:#e94560;font-size:20px;padding:0 10px}
.singer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.singer-card{text-align:center;cursor:pointer}
.singer-card .avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#e94560,#533483);margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px}
.singer-card .name{font-size:13px}
.banner{margin:16px;height:120px;border-radius:12px;background:linear-gradient(135deg,#e94560,#533483);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}
.empty{text-align:center;padding:60px 20px;color:#555}
</style>
</head>
<body>
<div class="search-bar">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索歌曲、歌手..." onkeypress="if(event.key==='Enter')doSearch()">
  </div>
  <div class="search-types">
    <button class="search-type active" data-type="all" onclick="setType('all')">综合</button>
    <button class="search-type" data-type="song" onclick="setType('song')">歌曲</button>
    <button class="search-type" data-type="singer" onclick="setType('singer')">歌手</button>
  </div>
</div>

<div id="content">
  <div class="banner">🎵 CorPlayer 音乐库</div>
  <div class="section">
    <h3>🔥 热门歌曲</h3>
    <div class="song-list" id="hotList"></div>
  </div>
  <div class="section">
    <h3>🎤 热门歌手</h3>
    <div class="singer-grid" id="singerGrid"></div>
  </div>
</div>

<div id="searchResult" style="display:none">
  <div class="section" id="searchSongsSection" style="display:none">
    <h3>歌曲</h3>
    <div class="song-list" id="searchSongs"></div>
  </div>
  <div class="section" id="searchSingersSection" style="display:none">
    <h3>歌手</h3>
    <div class="singer-grid" id="searchSingers"></div>
  </div>
  <div class="empty" id="searchEmpty" style="display:none">没有找到相关结果</div>
</div>

<div class="section" id="historySection">
  <h3>🕐 搜索历史 <span class="history-clear" onclick="clearHistory()">清空</span></h3>
  <div class="history" id="historyList"></div>
</div>

<script>
const BASE = location.origin + location.pathname.replace(/\/[^/]*$/,'/').replace(/\/app\/$/,'/');
let currentType = 'all';
let allSongs = [], allSingers = [];
const HISTORY_KEY = 'corplayer_search_history';

// 预加载数据
Promise.all([fetch(BASE+'data/songs.json').then(r=>r.json()),fetch(BASE+'data/singers.json').then(r=>r.json())]).then(([songs,singers])=>{
  allSongs = songs; allSingers = singers;
  document.getElementById('hotList').innerHTML = songs.slice(0,10).map((s,i)=>songHTML(s,i)).join('');
  document.getElementById('singerGrid').innerHTML = singers.slice(0,9).map(singerHTML).join('');
});

function setType(t){
  currentType = t;
  document.querySelectorAll('.search-type').forEach(b=>b.classList.toggle('active', b.dataset.type===t));
  if(document.getElementById('searchInput').value.trim()) doSearch();
}
function loadHistory(){
  const h = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
  const el = document.getElementById('historyList');
  if(h.length===0){document.getElementById('historySection').style.display='none';return}
  el.innerHTML = h.map(k=>`<span class="history-tag" onclick="searchFor('${k}')">${k}</span>`).join('');
}
function addHistory(q){
  let h = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');
  h = h.filter(x=>x!==q); h.unshift(q); h = h.slice(0,20);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); loadHistory();
}
function clearHistory(){localStorage.removeItem(HISTORY_KEY);loadHistory()}
function searchFor(q){document.getElementById('searchInput').value=q;doSearch()}

function doSearch(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if(!q){showHome();return}
  addHistory(q);
  document.getElementById('content').style.display='none';
  document.getElementById('historySection').style.display='none';
  document.getElementById('searchResult').style.display='block';
  const songs = allSongs.filter(s=>s.name.toLowerCase().includes(q)||s.singer.toLowerCase().includes(q));
  const singers = allSingers.filter(s=>s.name.toLowerCase().includes(q));
  const ss = document.getElementById('searchSongsSection');
  const sg = document.getElementById('searchSingersSection');
  const empty = document.getElementById('searchEmpty');
  ss.style.display = (currentType==='all'||currentType==='song')&&songs.length?'block':'none';
  sg.style.display = (currentType==='all'||currentType==='singer')&&singers.length?'block':'none';
  empty.style.display = (songs.length+singers.length===0)?'block':'none';
  document.getElementById('searchSongs').innerHTML = songs.map((s,i)=>songHTML(s,i)).join('');
  document.getElementById('searchSingers').innerHTML = singers.map(singerHTML).join('');
}
function showHome(){
  document.getElementById('content').style.display='block';
  document.getElementById('historySection').style.display='block';
  document.getElementById('searchResult').style.display='none';
}
function songHTML(s,i){
  return `<div class="song-item" onclick="playSong('${s.coreUrl}')">
    <span class="idx">${i+1}</span>
    <div class="info"><div class="title">${s.name}</div><div class="artist">${s.singer}</div></div>
    <span class="play-btn">▶</span></div>`;
}
function singerHTML(s){
  return `<div class="singer-card" onclick="openSinger('${s.name}')">
    <div class="avatar">🎤</div><div class="name">${s.name}</div></div>`;
}
function playSong(coreUrl){
  // cormusic:// 完整URL，结尾必须有/
  let url = coreUrl;
  if(!url.startsWith('http')) url = BASE + url;
  if(!url.endsWith('/')) url += '/';
  window.location.href = 'cormusic://' + url;
}
function openSinger(name){
  window.location.href = '../geshou.html?' + encodeURIComponent(name);
}
loadHistory();

// 检查URL参数是否有播放请求
const params = new URLSearchParams(window.location.search);
if(params.get('play')){
  setTimeout(()=>playSong(params.get('play')), 500);
}
</script>
</body>
</html>
